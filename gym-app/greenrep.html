<title>GreenRep</title>
<meta name="theme-color" content="#163A2C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#F2F3EF; --surface:#FFFFFF; --surface-2:#EEF1EC; --ink:#16211C; --ink-2:#34403A; --muted:#6B7570; --line:#E0E4DE;
  --green:#1F5641; --green-2:#2E7A5A; --green-soft:#E2EBE4; --on-green:#F3F6F1;
  --hero:#163A2C; --hero-2:#21543F; --on-hero:#EEF3EC; --hero-line:rgba(238,243,236,.16); --hero-panel:rgba(238,243,236,.07);
  --brass:#A98549; --brass-soft:#F2EBDD;
  --amber:#B7651A; --amber-soft:#F7E9DA; --red:#A63B2F;
  --fig:#1B2C24; --fig-far:#A9B8AF; --equip:#2A3530; --fig-bg:#EDF1EC; --fig-bg-2:#E3E9E3; --floor:#C9D3CB; --shadow-ink:rgba(22,33,28,.12);
  --protein:#2E7A5A; --carbs:#B8913E; --fat:#7D6BA8;
  --shadow:0 1px 0 rgba(22,33,28,.03),0 10px 30px -18px rgba(22,33,28,.25);
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0D1210; --surface:#141A17; --surface-2:#1A211D; --ink:#E6EBE7; --ink-2:#C4CEC8; --muted:#8C9892; --line:#242D28;
    --green:#8CCBA9; --green-2:#6FB892; --green-soft:#1A2A22; --on-green:#0C1912;
    --hero:#14261F; --hero-2:#1C3A2E; --on-hero:#E6EEE8; --hero-line:rgba(230,238,232,.12); --hero-panel:rgba(230,238,232,.05);
    --brass:#D2B070; --brass-soft:#2B2519;
    --amber:#E39A55; --amber-soft:#35251A; --red:#E47A6C;
    --fig:#DCE6E0; --fig-far:#4C5C54; --equip:#C2CCC6; --fig-bg:#18201C; --fig-bg-2:#131A16; --floor:#2E3A33; --shadow-ink:rgba(0,0,0,.35);
    --protein:#6FB892; --carbs:#D2B070; --fat:#A796D6;
    --shadow:0 1px 0 rgba(0,0,0,.2);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0D1210; --surface:#141A17; --surface-2:#1A211D; --ink:#E6EBE7; --ink-2:#C4CEC8; --muted:#8C9892; --line:#242D28;
  --green:#8CCBA9; --green-2:#6FB892; --green-soft:#1A2A22; --on-green:#0C1912;
  --hero:#14261F; --hero-2:#1C3A2E; --on-hero:#E6EEE8; --hero-line:rgba(230,238,232,.12); --hero-panel:rgba(230,238,232,.05);
  --brass:#D2B070; --brass-soft:#2B2519;
  --amber:#E39A55; --amber-soft:#35251A; --red:#E47A6C;
  --fig:#DCE6E0; --fig-far:#4C5C54; --equip:#C2CCC6; --fig-bg:#18201C; --fig-bg-2:#131A16; --floor:#2E3A33; --shadow-ink:rgba(0,0,0,.35);
  --protein:#6FB892; --carbs:#D2B070; --fat:#A796D6;
  --shadow:0 1px 0 rgba(0,0,0,.2);
}
*{box-sizing:border-box}
html,body{background:var(--ground)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--green-2);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
.app{max-width:560px;margin:0 auto;padding-inline:20px;padding-block:18px 120px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:4px 20px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-stretch:112%;font-size:19px;letter-spacing:-.01em}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--hero);display:grid;place-items:center}
.brand-mark svg{width:18px;height:18px}
.brand-mark svg path{stroke:var(--brass)}
.sync{font-size:12px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--green-2)}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-2)}
.icon-btn svg{width:18px;height:18px}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.h-display{font-family:var(--display);font-weight:700;font-stretch:112%;font-size:30px;line-height:1.08;letter-spacing:-.02em}
.h-sec{font-family:var(--display);font-weight:600;font-stretch:106%;font-size:17px;letter-spacing:-.01em}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-s{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.card.hero{background:radial-gradient(120% 90% at 100% 0%,var(--hero-2) 0%,var(--hero) 60%);color:var(--on-hero);border-color:transparent;padding:22px;box-shadow:0 18px 40px -24px rgba(12,40,28,.55)}
.card.hero .muted{color:inherit;opacity:.72}
.card.hero .eyebrow{color:var(--brass)}
.card.hero .h-display{font-size:34px}
.hero-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px;opacity:.8}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;text-decoration:none;color:var(--ink);transition:transform .12s ease,background-color .15s ease}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--on-green)}
.btn.big{min-height:54px;font-size:16px;width:100%;border-radius:16px}
.btn.onhero{background:var(--on-hero);color:var(--hero);border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent}
.btn.hero-ghost{background:transparent;color:var(--on-hero);border-color:var(--hero-line)}
.btn.danger{color:var(--red)}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px;border-radius:12px}
.btn svg{width:17px;height:17px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:13px;font-weight:500;white-space:nowrap;color:var(--ink-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:10px;min-height:38px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(22,33,28,.1)}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));z-index:20}
.tabbar-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--muted);font-size:11.5px;font-weight:600;letter-spacing:.02em;position:relative}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--ink)}
.tab.on::before{content:"";position:absolute;top:-9px;width:22px;height:2px;border-radius:2px;background:var(--brass)}
input.field,select.field,textarea.field{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2)}
textarea.field{min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
label.lbl{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
/* figures */
.fig{background:linear-gradient(180deg,var(--fig-bg) 0%,var(--fig-bg-2) 100%);border-radius:16px;aspect-ratio:1/1;max-width:100%;overflow:hidden;position:relative}
.fig svg{display:block;width:100%;height:100%}
.fig .lim{stroke:var(--fig);stroke-linecap:round;fill:none}
.fig .far .lim{stroke:var(--fig-far)}
.fig .head{fill:var(--fig)}
.fig .floor{stroke:var(--floor);stroke-width:1.5}
.fig .shadow{fill:var(--shadow-ink)}
.fig .prop{fill:var(--floor);stroke:none}
.fig .propl{stroke:var(--floor);stroke-width:4;stroke-linecap:round}
.fig .eq{fill:var(--equip)}
.fig .eqhub{fill:var(--fig-bg)}
.fig .eqbar{stroke:var(--equip);stroke-width:3;stroke-linecap:round}
.fig .cable{stroke:var(--floor);stroke-width:1.5}
.fig .far .eq{fill:var(--fig-far)}
.fig-tag{position:absolute;left:10px;top:10px;font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.card.hero .fig{background:var(--hero-panel);border:1px solid var(--hero-line)}
.card.hero .fig .lim{stroke:var(--on-hero)}
.card.hero .fig .far .lim{stroke:rgba(238,243,236,.35)}
.card.hero .fig .head{fill:var(--on-hero)}
.card.hero .fig .eq{fill:var(--brass)}
.card.hero .fig .eqhub{fill:var(--hero)}
.card.hero .fig .floor,.card.hero .fig .cable{stroke:var(--hero-line)}
.card.hero .fig .shadow{fill:rgba(0,0,0,.2)}
.card.hero .fig .prop{fill:var(--hero-line)}
.card.hero .fig .propl{stroke:var(--hero-line)}
.kcal-wrap{display:grid;grid-template-columns:120px 1fr;gap:20px;align-items:center}
.ring{position:relative;width:120px;height:120px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .big{font-family:var(--display);font-weight:600;font-size:28px;line-height:1;letter-spacing:-.02em}
.macro{display:flex;flex-direction:column;gap:5px}
.macro .bar{height:5px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.macro .bar i{display:block;height:100%;border-radius:99px}
.water{display:flex;gap:6px;flex-wrap:wrap}
.glass{width:28px;height:38px;border-radius:5px 5px 9px 9px;border:1.5px solid var(--line);background:transparent;padding:0;position:relative;overflow:hidden}
.glass.full{border-color:var(--green-2)}
.glass.full::after{content:"";position:absolute;left:0;right:0;bottom:0;height:72%;background:var(--green-2);opacity:.55}
.stats{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.stat{padding:16px 14px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat b{display:block;font-family:var(--display);font-weight:600;font-size:28px;line-height:1;letter-spacing:-.02em;margin-bottom:6px}
.stat span{font-size:12px;color:var(--muted);font-weight:500;line-height:1.3;display:block}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600}
.li .s{font-size:13px;color:var(--muted)}
.xbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:transparent;display:grid;place-items:center;flex:none;color:var(--muted)}
.xbtn svg{width:14px;height:14px}
.ex-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.ex-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow)}
.ex-card .n{font-weight:600;font-size:14px;line-height:1.3;padding:6px 6px 0}
.ex-card .m{font-size:12px;color:var(--muted);padding:0 6px 6px}
.mini-fig{width:56px;flex:none}
.mini-fig .fig{border-radius:12px}
.overlay{position:fixed;inset:0;background:rgba(8,14,11,.45);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--ground);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:26px 26px 0 0;padding-inline:20px;padding-block:10px calc(24px + env(safe-area-inset-bottom,0px))}
.grab{width:40px;height:4px;border-radius:99px;background:var(--line);margin:4px auto 10px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:14px;position:sticky;top:-10px;background:var(--ground);z-index:2;padding-top:6px}
.sheet-head .h-sec{font-size:21px;font-weight:700;font-stretch:112%}
.session{position:fixed;inset:0;background:var(--ground);z-index:30;overflow-y:auto}
.session-in{max-width:560px;margin:0 auto;padding-inline:20px;padding-block:0 140px}
.sess-head{position:sticky;top:0;background:color-mix(in srgb,var(--ground) 92%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);z-index:3;padding-block:calc(12px + env(safe-area-inset-top,0px)) 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.clock{font-family:var(--display);font-weight:600;font-size:28px;letter-spacing:-.02em}
.sets{display:grid;grid-template-columns:30px 1fr 1fr 1fr 46px;gap:8px;align-items:center}
.sets .hd{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sets input{width:100%;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);text-align:center;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.sets .prev{font-size:13px;color:var(--muted);text-align:center}
.setno{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-weight:600;font-size:12px;color:var(--muted)}
.check{width:46px;height:44px;border-radius:12px;border:1px solid var(--line);background:transparent;display:grid;place-items:center;color:var(--muted)}
.check svg{width:20px;height:20px;opacity:.4}
.check.done{background:var(--green);border-color:var(--green);color:var(--on-green)}
.check.done svg{opacity:1}
.restbar{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--hero);color:var(--on-hero);padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px))}
.restbar .btn{background:transparent;color:var(--on-hero);border-color:var(--hero-line)}
.restbar .btn.primary{background:var(--on-hero);color:var(--hero);border-color:transparent}
.restbar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.rest-time{font-family:var(--display);font-weight:600;font-size:32px;min-width:76px;letter-spacing:-.02em}
.rest-track{height:3px;border-radius:99px;background:var(--hero-line);overflow:hidden;margin-top:6px}
.rest-track i{display:block;height:100%;background:var(--brass)}
.restbar .small{color:var(--brass)!important;letter-spacing:.12em;text-transform:uppercase;font-size:11px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:11px 18px;border-radius:999px;font-weight:500;font-size:14px;z-index:60;max-width:calc(100% - 40px);box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
.steps{margin:0;padding-left:0;list-style:none;counter-reset:st;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:st;display:grid;grid-template-columns:26px 1fr;gap:10px}
.steps li::before{content:counter(st);width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--muted)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--green-soft);color:var(--green);font-size:12px;font-weight:600}
.pill.brass{background:var(--brass-soft);color:var(--brass)}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--body)}
.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px;font-size:14px}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:transparent;font-weight:600}
.stepper b{min-width:30px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.video-box video{width:100%;border-radius:16px;background:#000}
.date-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.food-item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;text-align:left;width:100%;border:0;background:transparent;padding:11px 0;border-top:1px solid var(--line)}
.food-item:first-child{border-top:0}
.food-item .k{font-family:var(--display);font-weight:600;font-size:17px}
.hist-ex{font-size:13px;color:var(--muted)}
.greet{display:flex;flex-direction:column;gap:2px;padding-bottom:4px}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding-top:6px}
@media (max-width:380px){.app,.sheet,.session-in{padding-inline:16px}.kcal-wrap{grid-template-columns:100px 1fr;gap:14px}.ring{width:100px;height:100px}.sets{grid-template-columns:28px 1fr 1fr 1fr 42px;gap:6px}.ex-grid{gap:8px}}
@media (min-width:520px){.ex-grid{grid-template-columns:repeat(3,1fr)}}
@media (prefers-reduced-motion: reduce){.btn{transition:none}}
</style>

function setSync(on,text){const el=$("#sync");el.classList.toggle("on",on);el.lastElementChild.textContent=text}
function cloudQueue(){if(!cloud.ready)return;clearTimeout(cloud.timer);cloud.timer=setTimeout(cloudPush,1200)}
async function cloudPush(){
  if(!cloud.ready)return;
  const docs=buildDocs(S);
  Object.keys(cloud.sent).forEach(k=>{if(!docs[k])docs[k]=k.startsWith("hist-")?{items:[]}:k.startsWith("food-")?{days:{}}:{}});
  const keys=Object.keys(docs).filter(k=>{const js=JSON.stringify(docs[k]);return cloud.sent[k]!==js});
  if(!keys.length)return;
  setSync(false,"Syncing…");
  try{
    for(const k of keys){const js=JSON.stringify(docs[k]);await cloud.col.doc(k).set(JSON.parse(js));cloud.sent[k]=js}
    setSync(true,"Synced");
  }catch(e){setSync(false,e&&e.code==="quota_exceeded"?"Cloud full":"On this device")}
}
async function cloudInit(){
  if(!window.claude||typeof window.claude.use!=="function")return;
  try{
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user)return;
    const id=await user.id();
    if(!id)return;
    cloud.db=db;cloud.col=db.collection("data/users/"+id);
    const snap=await cloud.col.get();
    const remote={};snap.docs.forEach(d=>{if(d.exists)remote[d.id]=d.data()});
    Object.keys(remote).forEach(k=>cloud.sent[k]=JSON.stringify(remote[k]));
    const rc=remote.core;
    if(rc&&(rc.updatedAt||0)>(S.updatedAt||0)){
      const n=defaults();
      ["settings","routines","schedule","bodyweight","videos","customFoods","customEx","active","updatedAt"].forEach(k=>{if(rc[k]!==undefined)n[k]=JSON.parse(JSON.stringify(rc[k]))});
      Object.keys(remote).forEach(k=>{
        if(k.startsWith("hist-"))(remote[k].items||[]).forEach(h=>n.history.push(JSON.parse(JSON.stringify(h))));
        if(k.startsWith("food-"))Object.assign(n.food,JSON.parse(JSON.stringify(remote[k].days||{})));
      });
      n.history.sort((a,b)=>a.start-b.start);
      S=migrate(n);try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}
      render();if(S.active)renderSession();
    }
    cloud.ready=true;setSync(true,"Synced");
    cloudPush();
  }catch(e){cloud.ready=false}
}

  if(onFloor.length){const xs=[pt.f1[0],pt.f2[0],pt.p[0]];const mn=Math.min(...xs),mx=Math.max(...xs);f.shadow.setAttribute("cx",((mn+mx)/2).toFixed(1));f.shadow.setAttribute("rx",Math.max(22,(mx-mn)/2+16).toFixed(1));f.shadow.setAttribute("opacity",1)}else f.shadow.setAttribute("opacity",0);

function tick(now){
  figs.forEach(f=>{
    if(!f.el.isConnected){figs.delete(f);return}
    const dt=f.last?Math.min(.1,(now-f.last)/1000):0;f.last=now;
    if(f.paused)return;
    f.phase+=dt*f.speed/f.ex.period;
    pose(f,(1-Math.cos(2*Math.PI*f.phase))/2);
  });
  requestAnimationFrame(tick);
}

function weekStart(d){const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return dkey(x)}
function weekCount(){const ws=weekStart(new Date());return S.history.filter(h=>h.date>=ws).length}
function weekStreak(){
  const weeks=new Set(S.history.map(h=>weekStart(parseKey(h.date))));
  let ws=weekStart(new Date()),n=0;
  if(!weeks.has(ws))ws=addDays(ws,-7);
  while(weeks.has(ws)){n++;ws=addDays(ws,-7)}
  return n;
}

/* ---------------- workout session ---------------- */
function startWorkout(rid){
  const r=routineById(rid);if(!r)return;
  if(S.active){toast("Finish or cancel your current workout first");renderSession();return}
  S.active={id:uid(),routineId:r.id,name:r.name,start:Date.now(),exercises:r.items.map(it=>{
    const prev=lastSetsFor(it.ex)||[];
    return {ex:it.ex,target:it.reps,sets:Array.from({length:it.sets},(_,i)=>({w:prev[i]?prev[i].w:(prev.length?prev[prev.length-1].w:""),r:"",done:false}))};
  })};
  save();closeSheet();renderSession();
}
let clockT=null;
function renderSession(){
  const root=$("#sessionRoot");
  if(!S.active){root.innerHTML="";clearInterval(clockT);document.body.style.overflow="";render();return}
  const a=S.active,u=S.settings.units;
  const blocks=a.exercises.map((x,ei)=>{
    const e=exById(x.ex),prev=lastSetsFor(x.ex)||[];
    const rows=x.sets.map((s,si)=>'<div class="setno">'+(si+1)+'</div>'+
      '<div class="prev num">'+(prev[si]?(e.bw?"":r1(prev[si].w)+"×")+prev[si].r:"–")+'</div>'+
      (e.bw?'<div class="prev">body</div>':'<input class="num" id="w-'+ei+'-'+si+'" type="number" inputmode="decimal" step="0.5" min="0" value="'+esc(s.w)+'" placeholder="'+u+'" data-sin="w" data-e="'+ei+'" data-s="'+si+'" aria-label="'+esc(e.name)+' set '+(si+1)+' weight">')+
      '<input class="num" id="r-'+ei+'-'+si+'" type="number" inputmode="numeric" min="0" value="'+esc(s.r)+'" placeholder="'+x.target+'" data-sin="r" data-e="'+ei+'" data-s="'+si+'" aria-label="'+esc(e.name)+' set '+(si+1)+' '+unitLabel(e)+'">'+
      '<button class="check'+(s.done?" done":"")+'" data-act="set-done" data-e="'+ei+'" data-s="'+si+'" aria-label="Mark set '+(si+1)+' done" aria-pressed="'+s.done+'">'+ICON.check+'</button>').join("");
    return '<section class="card stack-s'+(x.sets.every(s=>s.done)?" ":"")+'"><div class="row"><button class="mini-fig" style="border:0;padding:0;background:none;width:76px" data-act="ex-detail" data-id="'+esc(x.ex)+'" aria-label="How to do '+esc(e.name)+'">'+figHTML(x.ex)+'</button><div class="grow"><h3 class="h-sec">'+esc(e.name)+'</h3><div class="small muted num">Target '+x.sets.length+' × '+x.target+' '+unitLabel(e)+'</div><button class="btn sm ghost" style="padding-left:0;color:var(--green)" data-act="ex-detail" data-id="'+esc(x.ex)+'">See how to do it</button></div></div>'+
      '<div class="sets"><span class="hd">Set</span><span class="hd" style="text-align:center">Last</span><span class="hd" style="text-align:center">'+(e.bw?"":u)+'</span><span class="hd" style="text-align:center">'+unitLabel(e)+'</span><span></span>'+rows+'</div>'+
      '<div class="row"><button class="btn sm" data-act="add-set" data-e="'+ei+'">'+ICON.plus+'Add set</button>'+(x.sets.length>1?'<button class="btn sm ghost" data-act="rm-set" data-e="'+ei+'">Remove last set</button>':'')+'</div></section>';
  }).join("");
  const sc=root.firstElementChild?root.firstElementChild.scrollTop:0;
  root.innerHTML='<div class="session" role="dialog" aria-label="Workout in progress"><div class="session-in stack"><div class="sess-head"><div><div class="eyebrow">'+esc(a.name)+'</div><div class="clock num" id="clock">0:00</div></div><div class="row"><button class="btn sm" data-act="min-session">Minimise</button><button class="btn sm primary" data-act="finish">Finish</button></div></div>'+blocks+
   '<button class="btn" data-act="add-ex-session">'+ICON.plus+'Add an exercise</button><button class="btn danger ghost" data-act="cancel-workout">Cancel workout</button></div></div>';
  root.firstElementChild.scrollTop=sc;
  mountFigs(root);document.body.style.overflow="hidden";
  clearInterval(clockT);const upd=()=>{const el=$("#clock");if(!el)return;const s=Math.floor((Date.now()-a.start)/1000);el.textContent=(s>=3600?Math.floor(s/3600)+":"+pad(Math.floor(s/60)%60):Math.floor(s/60))+":"+pad(s%60)};upd();clockT=setInterval(upd,1000);
}
function finishWorkout(){
  const a=S.active;let setsDone=0,volume=0;
  a.exercises.forEach(x=>{const e=exById(x.ex);x.sets.forEach(s=>{if(s.done){setsDone++;if(!e.bw)volume+=(+s.w||0)*(+s.r||0)}})});
  if(!setsDone){confirmSheet("No sets done","You haven’t ticked any sets. Tick ✓ after each set to log it. Discard this workout?","Discard workout",()=>{S.active=null;save();stopRest();renderSession()});return}
  const h={id:a.id,date:dkey(new Date(a.start)),routineId:a.routineId,name:a.name,start:a.start,minutes:Math.max(1,Math.round((Date.now()-a.start)/60000)),setsDone,volume,
    exercises:a.exercises.map(x=>({ex:x.ex,sets:x.sets.map(s=>({w:+s.w||0,r:+s.r||0,done:s.done}))}))};
  S.history.push(h);S.active=null;save();stopRest();renderSession();
  openSheet("Workout saved",'<div class="card hero stack"><div class="h-display">Nice work!</div><div class="stats" style="color:var(--ink);box-shadow:none"><div class="stat"><b class="num">'+h.minutes+'</b><span>minutes</span></div><div class="stat"><b class="num">'+setsDone+'</b><span>sets</span></div><div class="stat"><b class="num">'+Math.round(volume)+'</b><span>'+S.settings.units+' lifted</span></div></div></div><p class="muted" style="margin:0">Next time, your numbers from today appear in the “Last” column so you can try to beat them.</p><button class="btn big primary" data-act="close-sheet">Done</button>');
}

/* ---------------- rest timer ---------------- */
const rest={end:0,total:0,t:null};
function startRest(){rest.total=S.settings.restSec;rest.end=Date.now()+rest.total*1000;clearInterval(rest.t);rest.t=setInterval(drawRest,250);drawRest()}
function stopRest(){clearInterval(rest.t);rest.end=0;$("#restRoot").innerHTML=""}
function drawRest(){
  const left=Math.max(0,Math.ceil((rest.end-Date.now())/1000));
  if(left<=0){stopRest();beep();toast("Rest over. Next set!");return}
  const r=$("#restRoot");
  if(!$("#sessionRoot").firstElementChild){r.innerHTML="";return}
  if(!r.firstElementChild)r.innerHTML='<div class="restbar" role="timer"><div class="restbar-in"><div class="rest-time num" id="restTime"></div><div class="grow" style="flex:1"><div class="small muted" style="font-weight:600">Rest</div><div class="rest-track"><i id="restFill"></i></div></div><button class="btn sm" data-act="rest-add">+15s</button><button class="btn sm primary" data-act="rest-skip">Skip</button></div></div>';
  $("#restTime").textContent=Math.floor(left/60)+":"+pad(left%60);
  $("#restFill").style.width=(left/rest.total*100)+"%";
}
let actx=null;
function beep(){try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();[0,.25].forEach(d=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.setValueAtTime(.001,actx.currentTime+d);g.gain.exponentialRampToValueAtTime(.3,actx.currentTime+d+.02);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d+.2);o.connect(g).connect(actx.destination);o.start(actx.currentTime+d);o.stop(actx.currentTime+d+.22)})}catch(e){}}

function addFood(fd,qty){

}

/* ---------------- settings ---------------- */
function calcGoals(pr){
  const kg=pr.weight*(S.settings.units==="lb"?0.4536:1);
  const bmr=10*kg+6.25*pr.height-5*pr.age+(pr.sex==="male"?5:-161);
  let kcal=bmr*pr.activity;kcal+=pr.goal==="lose"?-450:pr.goal==="gain"?300:0;kcal=Math.round(kcal/10)*10;
  const protein=Math.round(kg*1.8),fat=Math.round(kcal*.25/9),carbs=Math.max(0,Math.round((kcal-protein*4-fat*9)/4));
  return {kcal,protein,fat,carbs};
}

   '<label class="lbl" for="pS">Sex'+sel("pS",[["male","Male"],["female","Female"]],pr.sex)+'</label><label class="lbl" for="pA">Age<input class="field num" id="pA" type="number" value="'+pr.age+'"></label>'+
   '<label class="lbl" for="pH">Height (cm)<input class="field num" id="pH" type="number" value="'+pr.height+'"></label><label class="lbl" for="pWt">Weight ('+s.units+')<input class="field num" id="pWt" type="number" value="'+pr.weight+'"></label>'+
   '<label class="lbl" for="pAct">Activity'+sel("pAct",[[1.2,"Mostly sitting"],[1.375,"Light: 1–3 workouts/wk"],[1.55,"Active: 3–5 workouts/wk"],[1.725,"Very active: 6–7/wk"]],pr.activity)+'</label>'+
   '<label class="lbl" for="pG">Goal'+sel("pG",[["lose","Lose fat"],["maintain","Stay the same"],["gain","Build muscle"]],pr.goal)+'</label></div><button class="btn" id="calcBtn">Suggest my goals</button><div id="calcOut" class="small"></div></section>'+
   '<button class="btn big primary" id="saveSettings">Save settings</button>'+

/* ---------------- events ---------------- */
document.addEventListener("click",ev=>{
  const tab=ev.target.closest("[data-tab]");
  if(tab){ui.tab=tab.dataset.tab;try{localStorage.setItem(LS_KEY+".tab",ui.tab)}catch(e){}if(ui.tab==="food")ui.foodDate=dkey();render();window.scrollTo(0,0);return}
  const el=ev.target.closest("[data-act]");if(!el)return;
  const act=el.dataset.act,d=el.dataset;
  if(act==="close-sheet-bg"&&ev.target!==el)return;
  switch(act){
    case "close-sheet":case "close-sheet-bg":closeSheet();if(S.active&&$("#sessionRoot").firstElementChild)renderSession();break;
    case "settings":openSettings();break;
    case "start":startWorkout(d.id);break;
    case "resume":renderSession();break;
    case "pick-routine":pickRoutineSheet();break;
    case "wtab":ui.wtab=d.k;render();break;
    case "group":ui.group=d.g;render();break;
    case "ex-detail":openExDetail(d.id);break;
    case "custom-ex":openCustomEx();break;
    case "del-custom-ex":confirmSheet("Delete exercise?","It will be removed from your library and routines.","Delete",()=>{S.customEx=S.customEx.filter(x=>x.id!==d.id);S.routines.forEach(r=>r.items=r.items.filter(i=>i.ex!==d.id));delete S.videos[d.id];save();render()});break;
    case "save-video":{const v=$("#vidUrl").value.trim();if(v&&!/^https?:\/\//i.test(v)){toast("Links must start with https://");break}if(v)S.videos[d.id]=v;else delete S.videos[d.id];save();toast(v?"Video link saved":"Link removed");openExDetail(d.id);break}
    case "clear-video":delete S.videos[d.id];save();openExDetail(d.id);toast("Link removed");break;
    case "edit-routine":openRoutineEditor(d.id);break;
    case "ed-step":{const it=draft.items[+d.i],f=d.f;it[f]=Math.max(1,it[f]+(+d.d)*(f==="reps"&&exById(it.ex).timed?5:1));renderEditor();break}
    case "ed-del":draft.items.splice(+d.i,1);renderEditor();break;
    case "ed-add":{const e=exById(d.id);draft.items.push({ex:d.id,sets:e.sets||3,reps:e.reps||10});renderEditor();toast("Added "+e.name);break}
    case "ed-save":{if(!draft.name.trim()){toast("Give your routine a name");$("#rName").focus();break}if(!draft.items.length){toast("Add at least one exercise");break}const c={id:draft.id,name:draft.name.trim(),items:draft.items};const i=S.routines.findIndex(r=>r.id===c.id);if(i>=0)S.routines[i]=c;else S.routines.push(c);save();closeSheet();render();toast("Routine saved");break}
    case "ed-remove":confirmSheet("Delete routine?","“"+draft.name+"” will be removed from your routines and week plan.","Delete",()=>{S.routines=S.routines.filter(r=>r.id!==draft.id);Object.keys(S.schedule).forEach(k=>{if(S.schedule[k]===draft.id)S.schedule[k]=null});save();render();toast("Routine deleted")});break;
    case "set-done":{const s=S.active.exercises[+d.e].sets[+d.s];s.done=!s.done;if(s.done){const e=exById(S.active.exercises[+d.e].ex);if(!s.r)s.r=String(S.active.exercises[+d.e].target);startRest()}save();renderSession();break}
    case "add-set":{const x=S.active.exercises[+d.e],l=x.sets[x.sets.length-1]||{w:"",r:""};x.sets.push({w:l.w,r:"",done:false});save();renderSession();break}
    case "rm-set":S.active.exercises[+d.e].sets.pop();save();renderSession();break;
    case "add-ex-session":addExToSession();break;
    case "sess-add":{const e=exById(d.id);S.active.exercises.push({ex:d.id,target:e.reps||10,sets:Array.from({length:e.sets||3},()=>({w:"",r:"",done:false}))});save();closeSheet();renderSession();toast("Added "+e.name);break}
    case "min-session":$("#sessionRoot").innerHTML="";clearInterval(clockT);document.body.style.overflow="";ui.tab="today";render();break;
    case "finish":finishWorkout();break;
    case "cancel-workout":confirmSheet("Cancel workout?","Nothing from this session will be saved.","Cancel workout",()=>{S.active=null;save();stopRest();renderSession()});break;
    case "rest-add":rest.end+=15000;rest.total+=15;drawRest();break;
    case "rest-skip":stopRest();break;
    case "add-food":openAddFood(d.meal);break;
    case "meal":ui.addMeal=d.m;renderAddFood();break;
    case "addmode":ui.addMode=d.m;renderAddFood();break;
    case "qty":ui.addQty=+d.n;renderAddFood();break;
    case "pick-food":{const src=d.src,i=+d.i;const fd=src==="db"?FOODS[i]:src==="mine"?S.customFoods[i]:recentFoods()[i];if(fd){addFood(fd,ui.addQty);closeSheet()}break}
    case "del-food":{const day=S.food[ui.tab==="food"?ui.foodDate:dkey()];if(day){const it=day.items.splice(+d.i,1)[0];save();render();toast("Removed "+(it?it.name:"item"))}break}
    case "water":{const k=ui.tab==="food"?ui.foodDate:dkey();const day=S.food[k]||(S.food[k]={water:0,items:[]});const i=+d.i;day.water=day.water===i+1?i:i+1;save();render();break}
    case "fdate":{const n=addDays(ui.foodDate,+d.n);if(n<=dkey()){ui.foodDate=n;render()}break}
    case "ftoday":ui.foodDate=dkey();render();break;
    case "del-hist":confirmSheet("Delete workout?","This removes it from your history and stats.","Delete",()=>{S.history=S.history.filter(h=>h.id!==d.id);save();render()});break;
  }
});
document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.dataset.act==="plan"){S.schedule[t.dataset.d]=t.value||null;save();toast(DAYS[+t.dataset.d]+": "+(t.value?routineById(t.value).name:"Rest day"))}
});
document.addEventListener("input",ev=>{
  const t=ev.target;
  if(t.dataset.sin&&S.active){const s=S.active.exercises[+t.dataset.e].sets[+t.dataset.s];s[t.dataset.sin]=t.value;save()}
});
document.addEventListener("submit",ev=>{
  if(ev.target.id==="bwForm"){ev.preventDefault();const v=parseFloat($("#bwInput").value);if(!(v>0)){toast("Enter your weight first");return}const k=dkey();S.bodyweight=S.bodyweight.filter(b=>b.date!==k);S.bodyweight.push({date:k,w:v});S.bodyweight.sort((a,b)=>a.date<b.date?-1:1);save();render();toast("Weight logged")}
});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&$("#sheetRoot").firstElementChild)closeSheet()});

render();
cloudInit();
})();
</script>
